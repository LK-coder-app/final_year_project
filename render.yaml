# Render Blueprint Specification for AgriMind 24/7 Deployment
# Deploy directly at https://dashboard.render.com/blueprints
services:
  - type: web
    name: agrimind-backend
    runtime: docker
    plan: free
    region: singapore # Choose your preferred region: oregon, frankfurt, singapore, ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini # or "local" / "openai"
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./reports/agrimind.db
      - key: APP_BASE_URL
        sync: false # Set to your Render URL (e.g. https://agrimind-backend.onrender.com)
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
    disk:
      name: agrimind-data
      mountPath: /app/reports
      sizeGB: 1
