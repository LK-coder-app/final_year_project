<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriMind – Agricultural Requirement Details</title>
  <meta name="description" content="AgriMind Google Form for farmers to provide missing agricultural requirement information." />
  <link rel="icon" href="https://ssl.gstatic.com/docs/spreadsheets/forms/favicon_qp2.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0ebf8;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #202124;
      line-height: 1.5;
      padding-bottom: 40px;
    }
    .top-strip {
      height: 130px;
      background: linear-gradient(135deg, #673ab7, #512da8);
      position: relative;
    }
    .container {
      max-width: 640px;
      margin: -70px auto 0 auto;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }
    .card {
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(60,64,67,0.12), 0 1px 2px rgba(60,64,67,0.24);
      transition: border-left 0.2s ease, box-shadow 0.2s ease;
    }
    .card.focused {
      border-left: 5px solid #673ab7;
    }
    .header-card {
      border-top: 10px solid #673ab7;
      border-radius: 8px;
    }
    .header-card h1 {
      font-size: 32px;
      font-weight: 400;
      color: #202124;
      line-height: 40px;
      margin-bottom: 8px;
    }
    .header-desc {
      font-size: 14px;
      color: #3c4043;
      margin-bottom: 14px;
      line-height: 20px;
    }
    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ede7f6;
      color: #512da8;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 16px;
      margin-bottom: 14px;
    }
    .header-divider {
      height: 1px;
      background: #dadce0;
      margin: 12px 0 10px 0;
    }
    .required-notice {
      color: #d93025;
      font-size: 13px;
    }
    .question-title {
      font-size: 16px;
      font-weight: 500;
      color: #202124;
      margin-bottom: 6px;
    }
    .question-title .req {
      color: #d93025;
      margin-left: 4px;
    }
    .question-help {
      font-size: 12px;
      color: #70757a;
      margin-bottom: 16px;
    }
    .g-input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #dadce0;
      font-size: 14px;
      padding: 10px 0 6px 0;
      outline: none;
      color: #202124;
      font-family: inherit;
      background: transparent;
      transition: border-bottom-color 0.2s ease;
    }
    .g-input:focus {
      border-bottom: 2px solid #673ab7;
    }
    .g-select {
      width: 100%;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      color: #202124;
      background-color: #ffffff;
      font-family: inherit;
      margin-top: 6px;
      cursor: pointer;
    }
    .g-select:focus {
      border-color: #673ab7;
      box-shadow: 0 0 0 1px #673ab7;
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 14px;
      color: #3c4043;
    }
    .radio-option input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: #673ab7;
      cursor: pointer;
    }
    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      padding: 0 4px;
    }
    .submit-btn {
      background-color: #673ab7;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(60,64,67,0.3);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .submit-btn:hover {
      background-color: #5e35b1;
      box-shadow: 0 1px 3px rgba(60,64,67,0.4);
    }
    .submit-btn:disabled {
      background-color: #dadce0;
      color: #80868b;
      cursor: not-allowed;
      box-shadow: none;
    }
    .clear-btn {
      background: none;
      border: none;
      color: #673ab7;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 4px;
    }
    .clear-btn:hover {
      background-color: rgba(103, 58, 183, 0.08);
    }
    .footer-notice {
      text-align: center;
      font-size: 12px;
      color: #70757a;
      margin-top: 24px;
      line-height: 18px;
    }
    .footer-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 18px;
      color: #5f6368;
      font-weight: 500;
    }
    .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(103, 58, 183, 0.2);
      border-top-color: #673ab7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .success-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .success-link {
      display: inline-block;
      margin-top: 16px;
      color: #1a73e8;
      text-decoration: none;
      font-size: 14px;
    }
    .success-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Google Forms Iconic Purple Header Strip -->
  <div class="top-strip"></div>

  <div class="container">
    <div id="app-root">
      <div class="card" style="text-align: center; padding: 48px 24px;">
        <div class="spinner"></div>
        <p style="margin-top: 16px; font-size: 14px; color: #5f6368;">Loading Google Form...</p>
      </div>
    </div>

    <div class="footer-notice">
      Never submit passwords through Google Forms.<br>
      This form was created inside AgriMind AI System. · 
      <a href="#" style="color:#70757a; text-decoration:underline;">Report Abuse</a> · 
      <a href="#" style="color:#70757a; text-decoration:underline;">Terms of Service</a>
      <div class="footer-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#673ab7">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        <span>Google Forms</span>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const API = '/api';

    function getToken() {
      return new URLSearchParams(window.location.search).get('token');
    }

    const FIELD_CONFIG = {
      land_size: {
        title: 'Farm Land Area (நிலப் பரப்பு)',
        help: 'Total land area available for cultivation (e.g., 2.5, 5).',
        type: 'number',
        unit: 'acres',
        required: true,
      },
      land_unit: {
        title: 'Land Unit (நில அளவு அலகு)',
        help: 'Measurement unit of your agricultural land.',
        type: 'select',
        options: ['acres', 'hectares', 'cents'],
        required: true,
      },
      crop_types: {
        title: 'Target Crops (பயிர் வகைகள்)',
        help: 'Specific crops planned or planted (e.g. Sugarcane, Banana, Tomato, Coconut).',
        type: 'text',
        placeholder: 'Enter crop names separated by commas',
        required: true,
      },
      water_source: {
        title: 'Water Source (நீர் ஆதாரம்)',
        help: 'Primary irrigation water supply available at the farm.',
        type: 'radio',
        options: ['Borewell', 'Open Well', 'Canal', 'River', 'Tank / Pond', 'Rainwater Harvesting'],
        required: true,
      },
      borewell_depth_ft: {
        title: 'Borewell Depth (போர்வெல் ஆழம்)',
        help: 'Depth of the borewell in feet (e.g. 450).',
        type: 'number',
        unit: 'feet',
        required: false,
      },
      open_well_depth_ft: {
        title: 'Open Well Depth (கிணறு ஆழம்)',
        help: 'Depth of the open well in feet (e.g. 60).',
        type: 'number',
        unit: 'feet',
        required: false,
      },
      motor_hp: {
        title: 'Pump Motor Power (மோட்டார் குதிரைத்திறன்)',
        help: 'Power of the electric or solar pump in Horsepower (HP).',
        type: 'number',
        unit: 'HP',
        required: true,
      },
      irrigation_type: {
        title: 'Irrigation Method (பாசன முறை)',
        help: 'Type of irrigation system currently installed or requested.',
        type: 'radio',
        options: ['Drip Irrigation', 'Sprinkler', 'Micro Sprinkler', 'Flood / Furrow', 'Rain Gun'],
        required: true,
      },
      soil_type: {
        title: 'Soil Classification (மண் வகை)',
        help: 'Soil type of the cultivation plot.',
        type: 'radio',
        options: ['Red Loam', 'Black Cotton Soil', 'Alluvial Clay', 'Sandy Loam', 'Clay Soil'],
        required: false,
      },
      power_supply_phase: {
        title: 'Power Supply Phase (மின் இணைப்பு கட்டம்)',
        help: 'Type of agricultural electricity connection available.',
        type: 'radio',
        options: ['Three Phase', 'Single Phase', 'Solar Powered'],
        required: false,
      },
      power_hours_per_day: {
        title: 'Daily Power Availability (மின்சாரம் கிடைக்கும் நேரம்)',
        help: 'Number of uninterrupted power supply hours per day.',
        type: 'number',
        unit: 'hours/day',
        required: false,
      },
      district: {
        title: 'District / Region (மாவட்டம்)',
        help: 'District in Tamil Nadu where the agricultural land is located.',
        type: 'text',
        placeholder: 'e.g. Coimbatore, Erode, Tiruppur, Thanjavur',
        required: false,
      },
      budget_inr: {
        title: 'Expected Budget (திட்ட பட்ஜெட்)',
        help: 'Estimated or allocated budget in Indian Rupees (₹).',
        type: 'number',
        unit: '₹ INR',
        required: false,
      }
    };

    let formPayload = null;

    async function loadForm() {
      const token = getToken();
      if (!token) {
        renderError('Missing or Invalid Token', 'Please contact the AgriMind admin or check your SMS link.');
        return;
      }

      try {
        const res = await fetch(`${API}/form/${token}`);
        if (!res.ok) {
          throw new Error('This form link is invalid or has already expired.');
        }
        formPayload = await res.json();
        renderForm(formPayload);
      } catch (err) {
        renderError('Form Not Available', err.message);
      }
    }

    function renderError(title, msg) {
      document.getElementById('app-root').innerHTML = `
        <div class="card header-card">
          <h1>⚠️ ${title}</h1>
          <div class="header-divider"></div>
          <p style="color:#5f6368; font-size:14px; margin-top:8px;">${msg}</p>
        </div>
      `;
    }

    function renderForm(data) {
      const missingFields = data.missing_fields || [];
      const root = document.getElementById('app-root');

      if (missingFields.length === 0) {
        root.innerHTML = `
          <div class="card header-card">
            <h1>AgriMind – Requirement Details</h1>
            <div class="meta-badge">Report: ${data.report_id} · ${data.farmer_name || 'Farmer'}</div>
            <p class="header-desc">All required engineering parameters have already been provided. No additional data is needed for this application.</p>
            <div class="header-divider"></div>
            <p style="color:#0f9d58; font-weight:500; font-size:14px;">✅ Application is 100% complete.</p>
          </div>
        `;
        return;
      }

      let html = `
        <div class="card header-card">
          <h1>AgriMind – Agricultural Requirement Details</h1>
          <div class="meta-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#512da8"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>Application ID: ${data.report_id}</span>
          </div>
          <p class="header-desc">
            Dear <strong>${data.farmer_name || 'Farmer'}</strong>, our agricultural engineering system requires the following missing parameters to complete your feasibility assessment and issue your official report.
          </p>
          <div class="header-divider"></div>
          <div class="required-notice">* Indicates required question</div>
        </div>

        <form id="google-missing-form" onsubmit="handleFormSubmit(event)">
      `;

      missingFields.forEach(f => {
        const fieldKey = f.field;
        const cfg = FIELD_CONFIG[fieldKey] || {
          title: f.label || fieldKey,
          help: 'Please provide this required information.',
          type: 'text',
          required: true
        };

        html += `
          <div class="card" id="card-${fieldKey}" onclick="highlightCard('${fieldKey}')">
            <div class="question-title">
              ${cfg.title}
              ${cfg.required ? '<span class="req">*</span>' : ''}
            </div>
            <div class="question-help">${cfg.help}</div>
            ${renderFieldInput(fieldKey, cfg)}
          </div>
        `;
      });

      html += `
          <div class="btn-row">
            <button type="submit" id="submit-btn" class="submit-btn">Submit</button>
            <button type="button" class="clear-btn" onclick="document.getElementById('google-missing-form').reset()">Clear form</button>
          </div>
        </form>
      `;

      root.innerHTML = html;
    }

    function renderFieldInput(fieldKey, cfg) {
      if (cfg.type === 'radio') {
        return `
          <div class="radio-group">
            ${cfg.options.map((opt, i) => `
              <label class="radio-option">
                <input type="radio" name="${fieldKey}" value="${opt}" ${cfg.required && i === 0 ? 'required' : ''}>
                <span>${opt}</span>
              </label>
            `).join('')}
          </div>
        `;
      } else if (cfg.type === 'select') {
        return `
          <select name="${fieldKey}" class="g-select" ${cfg.required ? 'required' : ''}>
            ${cfg.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
          </select>
        `;
      } else if (cfg.type === 'number') {
        return `
          <input type="number" step="any" name="${fieldKey}" class="g-input" placeholder="Your answer${cfg.unit ? ' (' + cfg.unit + ')' : ''}" ${cfg.required ? 'required' : ''}>
        `;
      } else {
        return `
          <input type="text" name="${fieldKey}" class="g-input" placeholder="${cfg.placeholder || 'Your answer'}" ${cfg.required ? 'required' : ''}>
        `;
      }
    }

    function highlightCard(fieldKey) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('focused'));
      const target = document.getElementById(`card-${fieldKey}`);
      if (target) target.classList.add('focused');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Submitting...';

      const form = document.getElementById('google-missing-form');
      const formData = new FormData(form);
      const filledData = {};

      for (const [key, val] of formData.entries()) {
        const trimmed = (typeof val === 'string') ? val.trim() : val;
        if (trimmed !== '') {
          const cfg = FIELD_CONFIG[key];
          if (cfg && cfg.type === 'number') {
            filledData[key] = parseFloat(trimmed) || trimmed;
          } else if (key === 'crop_types') {
            filledData[key] = trimmed.split(',').map(s => s.trim()).filter(Boolean);
          } else {
            filledData[key] = trimmed;
          }
        }
      }

      const reqId = formPayload.requirement_id;
      const token = getToken();

      try {
        const res = await fetch(`${API}/requirements/${reqId}/fill-missing`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            filled_data: filledData
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || 'Failed to submit form data.');
        }

        const result = await res.json();
        renderSuccess(result);
      } catch (err) {
        alert('Submission failed: ' + err.message);
        btn.disabled = false;
        btn.innerText = 'Submit';
      }
    }

    function renderSuccess(result) {
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="card header-card">
          <h1>AgriMind – Agricultural Requirement Details</h1>
          <div style="font-size:14px; color:#202124; margin:16px 0 12px 0;">
            Your response has been recorded.
          </div>
          <p style="font-size:13px; color:#5f6368; line-height:20px;">
            The AgriMind engineering administration team has been automatically notified. They will review your updated parameters and regenerate your engineering feasibility report.
          </p>
          <div class="header-divider"></div>
          <div style="margin-top:16px; font-size:13px; color:#0f9d58; font-weight:500;">
            ✅ ${result.updated_fields ? result.updated_fields.length : ''} parameter(s) submitted successfully.
          </div>
          <a href="/" class="success-link">Return to Farmer Portal</a>
        </div>
      `;
    }

    window.addEventListener('DOMContentLoaded', loadForm);
  </script>
</body>
</html>
