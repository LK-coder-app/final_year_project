  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">

</head>
<body>
  <script>
    window.agrimindVoice = {
      recTa: null,
      recEn: null,
      isRecording: false,
      start: function(mode) {
        var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          window.dispatchEvent(new CustomEvent('agrimind-voice-error', { detail: 'Speech recognition is not supported in this browser.' }));
          return false;
        }
        this.isRecording = true;
        var self = this;
        var activeRecs = [];

        function setup(lang) {
          var r = new SpeechRecognition();
          r.continuous = false;
          r.interimResults = true;
          r.lang = lang;
          r.onresult = function(e) {
            var text = '';
            for (var i = 0; i < e.results.length; i++) {
              text += e.results[i][0].transcript;
            }
            window.dispatchEvent(new CustomEvent('agrimind-voice-result', { detail: { text: text, lang: lang } }));
          };
          r.onerror = function(e) {
            if (e.error !== 'no-speech' && e.error !== 'aborted') {
              window.dispatchEvent(new CustomEvent('agrimind-voice-error', { detail: e.error }));
            }
          };
          r.onend = function() {
            activeRecs = activeRecs.filter(function(x) { return x !== r; });
            if (activeRecs.length === 0) {
              self.isRecording = false;
              window.dispatchEvent(new CustomEvent('agrimind-voice-end'));
            }
          };
          return r;
        }

        if (mode === 'tamil' || mode === 'auto') {
          this.recTa = setup('ta-IN');
          try { this.recTa.start(); activeRecs.push(this.recTa); } catch(e){}
        }
        if (mode === 'english' || mode === 'auto') {
          this.recEn = setup('en-IN');
          setTimeout(function() {
            try { self.recEn.start(); activeRecs.push(self.recEn); } catch(e){}
          }, 80);
        }
        return true;
      },
      stop: function() {
        this.isRecording = false;
        if (this.recTa) try { this.recTa.stop(); } catch(e){}
        if (this.recEn) try { this.recEn.stop(); } catch(e){}
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
